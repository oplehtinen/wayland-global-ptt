name: Build and Release

on:
  push:
    branches:
      - main 
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name'
        required: true
        default: 'Release'
      release_version:
        description: 'Version number (e.g., 1.0.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libevdev-dev libasound2-dev pkg-config

      - name: Build
        run: make

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: push-to-talk
          name: ${{ github.event.inputs.release_name || format('Release {0}', github.run_number) }}
          tag_name: ${{ github.event.inputs.release_version || format('release-{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
